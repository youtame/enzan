name: Deploy VitePress to GitHub Pages

# For Testing
#on:
#  push:
#    branches:
#      - main
#  workflow_dispatch:

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build VitePress site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4


      - name: Notify Slack (deploy success)
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{
            "text": "VitePress deployed to GitHub Pages\nRepository: '"${{ github.repository }}"'\nBranch: '"${{ github.ref_name }}"'\nActor: '"${{ github.actor }}"'"
          }' \
          ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack (deploy failure)
        if: always() && failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{
            "text": "Deployed failed\nRepository: '"${{ github.repository }}"'\nWorkflow: '"${{ github.workflow }}"'\nRun: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|詳細を見る>"
          }' \
          ${{ secrets.SLACK_WEBHOOK_URL }}
