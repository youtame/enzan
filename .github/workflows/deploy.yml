name: Deploy VitePress to GitHub Pages

# For Testing
#on:
#  push:
#    branches:
#      - main
#  workflow_dispatch:

on:
  push:
    tags:
      - 'deploy-*'
  workflow_dispatch:
    inputs:
      deploy_reason:
        description: 'Deploy reason (optional)'
        required: true
        default: 'manual deploy'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy_type: ${{ steps.context.outputs.deploy_type }}
      deploy_ref: ${{ steps.context.outputs.deploy_ref }}
      deploy_reason: ${{ steps.context.outputs.deploy_reason }}

    steps:
      - uses: actions/checkout@v4

      - name: Set deploy context
        id: context
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy_type=manual" >> $GITHUB_OUTPUT
            echo "deploy_ref=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "deploy_reason=${{ github.event.inputs.deploy_reason }}" >> $GITHUB_OUTPUT
          else
            echo "deploy_type=tag" >> $GITHUB_OUTPUT
            echo "deploy_ref=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "deploy_reason=tag deploy" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build VitePress site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    runs-on: ubuntu-latest

    steps:
      - name: Guard manual deploy branch
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
        run: |
          echo "Manual deploy is only allowed on main branch"
          exit 1

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Notify Slack (deploy success)
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{
            "text": ":rocket: VitePress deploy success\n"\
                    "Type: '"${{ needs.build.outputs.deploy_type }}"'\n"\
                    "Ref: '"${{ needs.build.outputs.deploy_ref }}"'\n"\
                    "Reason: '"${{ needs.build.outputs.deploy_reason }}"'\n"\
                    "Repo: '"${{ github.repository }}"'\n"\
                    "Actor: '"${{ github.actor }}"'"
          }' \
          ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack (deploy failure)
        if: always() && failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{
            "text": "Deployed failed\nRepository: '"${{ github.repository }}"'\nWorkflow: '"${{ github.workflow }}"'\nRun: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|詳細を見る>"
          }' \
          ${{ secrets.SLACK_WEBHOOK_URL }}